version: '3.8'

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=${SA_PASSWORD}
    ports:
      - "1433:1433"
    volumes:
      - sqldata:/var/opt/mssql
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P ${SA_PASSWORD} -Q "SELECT 1" -C || exit 1
      interval: 10s
      retries: 10
      start_period: 30s
      timeout: 3s

  app:
    build: .
    ports:
      - "8000:8080"
    environment:
      - ITEMS_PATH=/app/items
      - ASPNETCORE_ENVIRONMENT=Development  
      - ConnectionStrings__DefaultConnection=Server=sqlserver;Database=CrazyCloset;User Id=sa;Password=${SA_PASSWORD};TrustServerCertificate=True
    volumes:
      - D:\Desktop\crazycloset_items\items:/app/items
    depends_on:
      sqlserver:
        condition: service_healthy


volumes:
  sqldata: